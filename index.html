<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أقوى منصة تعليمية في مصر | EduEgy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
  </head>
  <body class="bg-gray-50">
    <div id="root">
      <div class="flex h-screen items-center justify-center flex-col gap-4">
        <p class="text-xl font-bold">جاري تحميل المنصة...</p>
        <p id="error-log" class="text-red-600 text-sm p-4 bg-red-50 rounded max-w-lg"></p>
      </div>
    </div>

    <script>
      window.addEventListener('error', (e) => {
        document.getElementById('error-log').innerText = 
          'خطأ: ' + e.message + '\n الملف: ' + e.filename;
      });
    </script>
    <script type="module" src="/assets/index-BIR-APai.js"></script>
  </body>
</html>
